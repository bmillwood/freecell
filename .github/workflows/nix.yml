on:
  push:
    branches:
      - main
  # No paths filter: every pull request gets a preview deploy, so every pull
  # request needs a build, whatever it touched.
  pull_request:

env:
  nixpkgs_version: 9fbb54b33e91ee4ca368e35a78e0613c720600b3 # renovate: datasource=git-refs depName=NixOS/nixpkgs packageName=https://github.com/NixOS/nixpkgs currentValue=nixos-unstable

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    permissions:
      contents: read
      pages: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz

      - run: nix-build

      # main is deployed for real from elsewhere, so it only needs the build as
      # a check. Pull requests additionally hand their build to preview.yml,
      # which assembles every open preview into one Pages deployment.
      - if: github.event_name == 'pull_request'
        # result/ is a symlink into a read-only store, neither of which
        # survives being zipped up into an artifact.
        run: cp --no-preserve=mode --recursive --dereference result site

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-pr-${{ github.event.number }}
          path: site/
          retention-days: 14

      # Only on opened: the URL doesn't change as the branch is pushed to, so
      # repeating it on every run would just be noise.
      - if: github.event.action == 'opened'
        run: |
          page_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Playable preview of this branch: ${page_url}pr/$NUMBER/ (live once the deploy finishes)"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}
