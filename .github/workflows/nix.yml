on:
  push:
    branches:
      - main
  # No paths filter: every pull request gets a preview deploy, so every pull
  # request needs a build, whatever it touched.
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  nixpkgs_version: 1559d3daa3ecc813a650b79375ea61b6741b8746 # renovate: datasource=git-refs depName=NixOS/nixpkgs packageName=https://github.com/NixOS/nixpkgs currentValue=nixos-unstable

# Both jobs push to gh-pages, and neither can rebase, so let them queue.
concurrency: gh-pages

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      # main goes to the root of the site, pull requests to pr/<number>/
      dir: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.number) || '.' }}
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz

      - run: nix-build

      # A pull request from a fork gets a read-only token, so there's nothing
      # to deploy with. Build it anyway, just don't try to publish it.
      - name: publish to gh-pages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages
          git worktree add pages -B gh-pages origin/gh-pages
          mkdir -p "pages/$dir"
          # The build is two files with fixed names, so copying over the top of
          # whatever is there is enough: nothing can be left behind stale.
          cp result/index.html result/elm.js "pages/$dir/"
          git -C pages add .
          if git -C pages diff --cached --quiet
          then echo "no change to publish"
          else
            git -C pages commit -m "deploy ${GITHUB_SHA:0:7} to ${dir}"
            git -C pages push origin gh-pages
          fi

      # Only on opened: the URL doesn't change as the branch is pushed to, so
      # repeating it on every run would just be noise.
      - if: github.event.action == 'opened'
        run: |
          gh pr comment "$NUMBER" --body "Playable preview of this branch: ${url}pr/$NUMBER/"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}

  clean:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: delete this pull request's preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages
          git worktree add pages -B gh-pages origin/gh-pages
          git -C pages rm -rq --ignore-unmatch "pr/$NUMBER"
          if git -C pages diff --cached --quiet
          then echo "no preview to delete"
          else
            git -C pages commit -m "delete preview for pr/$NUMBER"
            git -C pages push origin gh-pages
          fi
        env:
          NUMBER: ${{ github.event.number }}
