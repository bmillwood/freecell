on:
  push:
    branches:
      - main
  # No paths filter: every pull request gets a preview deploy, so every pull
  # request needs a build, whatever it touched.
  pull_request:

env:
  nixpkgs_version: 2786a2a72088ecf32aea5b3ec52099e6a7cff78f # renovate: datasource=git-refs depName=NixOS/nixpkgs packageName=https://github.com/NixOS/nixpkgs currentValue=nixos-unstable

jobs:
  build:
    # this environment contains the cachix signing key and auth token
    environment: ${{ github.ref == 'refs/heads/main' && 'default-branch' || '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    permissions:
      contents: read
      pages: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bmillwood
          # if not on the env with these secrets, they'll just be empty, which is fine
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix-build

      # main is deployed for real from elsewhere, so it only needs the build as
      # a check. Pull requests additionally hand their build to preview.yml,
      # which assembles every open preview into one Pages deployment.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-pr-${{ github.event.number }}
          path: result
          retention-days: 14

      # Only on opened: the URL doesn't change as the branch is pushed to, so
      # repeating it on every run would just be noise.
      - if: github.event.action == 'opened'
        run: |
          page_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Playable preview of this branch: ${page_url}pr/$NUMBER/ (live once the deploy finishes)"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}
