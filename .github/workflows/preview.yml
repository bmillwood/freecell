# Assembles every pull request's build into one Pages deployment, so that
# opening a second pull request doesn't evict the first one's preview.
on:
  workflow_run:
    workflows: [.github/workflows/nix.yml]
    types: [completed]
  # Previews expire with their artifacts rather than being deleted, so there
  # is rarely a reason to run this by hand -- but there's no reason not to.
  workflow_dispatch:
  # A dry run: assemble the site exactly as a real run would, and stop short
  # of deploying it. Only worth doing when this file is what changed.
  pull_request:
    paths:
      - .github/workflows/preview.yml

# Listing the artifacts is part of the critical section, so the group covers
# the whole workflow and not just the deployment: a run that listed before a
# newer one uploaded would otherwise be able to deploy a site missing that
# upload, and win by finishing last.
#
# Dry runs deploy nothing, so they neither need to wait for that group nor to
# survive being superseded.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-dry-run-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assemble:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    permissions:
      actions: read

    steps:
      # Every deployment is the whole site, rebuilt from whichever previews
      # exist right now, so nothing is carried over from the last one.
      - run: |
          mkdir site
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq '[.artifacts[] | select(.expired | not) | select(.name | startswith("site-pr-"))]' \
          | jq --slurp --raw-output '
              add
              # Several runs of the same pull request upload the same artifact
              # name; only the newest of them is the current preview.
              | group_by(.name) | map(max_by(.created_at))
              | .[] | "\(.name | ltrimstr("site-pr-"))\t\(.archive_download_url)"
            ' \
          | while IFS=$'\t' read -r number url; do
              # curl declines to pass the Authorization header on to the
              # storage host it gets redirected to, which is what we want.
              curl --silent --show-error --fail --location \
                --header "Authorization: Bearer $GH_TOKEN" \
                --output preview.zip "$url"
              # -d creates the directory but not its parents.
              mkdir -p "site/pr/$number"
              unzip -q preview.zip -d "site/pr/$number"
              echo "unpacked pr/$number"
            done
        env:
          GH_TOKEN: ${{ github.token }}

      # The root of the previews site isn't any particular preview, so it may
      # as well be a way to find them.
      - run: |
          exec > site/index.html
          echo '<!DOCTYPE html>'
          echo '<meta charset="UTF-8">'
          echo '<title>FreeCell previews</title>'
          echo '<h1>FreeCell previews</h1>'
          if [ -d site/pr ]; then
            echo '<ul>'
            for dir in site/pr/*/; do
              number=$(basename "$dir")
              echo "<li><a href=\"pr/$number/\">#$number</a></li>"
            done
            echo '</ul>'
          else
            echo '<p>None at the moment.</p>'
          fi

      # A dry run uploads this too, so that what it would have deployed is
      # there to be downloaded and looked at.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: assemble
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
